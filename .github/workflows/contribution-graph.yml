name: Contribution graph

on:
  schedule:
    # Daily at 06:00 UTC (01:00 America/Bogota)
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/contribution-graph.yml"

permissions:
  contents: write

concurrency:
  group: contribution-graph
  cancel-in-progress: true

jobs:
  generate:
    name: Render and publish
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Render contribution graph
        uses: Platane/snk@v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/contribution-graph-light.svg?palette=github-light
            dist/contribution-graph-dark.svg?palette=github-dark

      # Platane/snk is a Docker container action, so everything it writes into
      # dist/ is owned by root. The steps below run as the unprivileged "runner"
      # user, so ownership has to be handed over before git can touch the files.
      - name: Take ownership of generated files
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" dist

          shopt -s nullglob
          files=(dist/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::snk produced no files in dist/"
            exit 1
          fi

          echo "Generated files:"
          for f in "${files[@]}"; do
            echo "  $f ($(wc -c < "$f") bytes)"
          done

      # The SVGs live on a dedicated orphan branch so main keeps a clean history.
      # The README reads them from this repository, so rendering the profile
      # never depends on a third-party service being online.
      - name: Publish to output branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist

          git init --initial-branch=output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git status --short
          git commit --message "chore: regenerate contribution graph"

          # The token is kept out of the traced command line on purpose.
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config --local "http.https://github.com/.extraheader" \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          git push --force origin output

          echo "Published to the output branch."
